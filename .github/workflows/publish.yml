name: リール公開

# public リポジトリのため pull_request トリガーは付けない。
# フォークからの PR が secrets に触れられてしまうのを防ぐため。
on:
  schedule:
    # GitHub の定時実行は高負荷時にキューされず破棄されることがある。
    # 実際 2026-08-29 の 21:00 JST 枠は発火せず、手動投稿で復旧している。
    # publish.py は「予定時刻から±90分外ならスキップ」「published ならスキップ」
    # なので何回撃っても二重投稿にならない。1発勝負をやめ、枠ごとに4発置く。
    # 毎時0分は cron が集中して遅延しやすいため :41 / :48 / :56 を主軸にする。
    - cron: '41 20 * * *'     # 05:41 JST ┐
    - cron: '48 20 * * *'     # 05:48 JST │ 06:00枠
    - cron: '56 20 * * *'     # 05:56 JST │
    - cron: '3 21 * * *'      # 06:03 JST ┘
    - cron: '41 2 * * *'      # 11:41 JST ┐
    - cron: '48 2 * * *'      # 11:48 JST │ 12:00枠
    - cron: '56 2 * * *'      # 11:56 JST │
    - cron: '3 3 * * *'       # 12:03 JST ┘
    - cron: '41 8 * * *'      # 17:41 JST ┐
    - cron: '48 8 * * *'      # 17:48 JST │ 18:00枠
    - cron: '56 8 * * *'      # 17:56 JST │
    - cron: '3 9 * * *'       # 18:03 JST ┘
    # 旧 '0 12 * * *'(21:00 JST)は初日2本目専用で、その枠は公開済み。
    # 以降は毎日何もせず終わるだけの空振りなので削除した。
  workflow_dispatch:
    inputs:
      key:
        description: '取りこぼしを手動で公開するときだけ指定(例 003_20260830_0600)。空なら通常どおり時刻で選ぶ'
        required: false
        default: ''

concurrency:
  group: ig-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: リールを公開する
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PUBLISH_KEY: ${{ inputs.key }}
        run: python publish/publish.py
      - name: state.json を保存する
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: 投稿結果を記録"
            git push
          fi
