name: リール公開

# public リポジトリのため pull_request トリガーは付けない。
# フォークからの PR が secrets に触れられてしまうのを防ぐため。
on:
  schedule:
    # 毎時0分は世界中の cron が集中して遅延しやすいため、4分前倒しの :56 に置く。
    # 遅延は後ろにしか動かないので、起点を前に置くと予定時刻に着地しやすい。
    # publish.py の判定は ±90分の絶対値なので、前倒し起動でも当該枠を拾う。
    - cron: '56 20 * * *'     # 05:56 JST(06:00枠)
    - cron: '56 2 * * *'      # 11:56 JST(12:00枠)
    - cron: '56 8 * * *'      # 17:56 JST(18:00枠)
    - cron: '0 12 * * *'      # 21:00 JST(初日の2本目用。schedule.json に該当が無い日は
                              #  publish.py の ±90分判定で何もせず終了する)
  workflow_dispatch:

concurrency:
  group: ig-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: リールを公開する
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python publish/publish.py
      - name: state.json を保存する
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: 投稿結果を記録"
            git push
          fi
